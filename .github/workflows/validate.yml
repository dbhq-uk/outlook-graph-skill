name: Validate plugin

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate plugin manifest is valid JSON
        run: jq empty .claude-plugin/plugin.json

      - name: Check shell scripts parse
        # Root installers included: they grew per-skill dependency logic when the
        # repo became a pack, and a syntax error there breaks every install.
        run: |
          fail=0
          while IFS= read -r s; do
            bash -n "$s" || { echo "Syntax error: $s"; fail=1; }
          done < <({ find . -maxdepth 1 -name '*.sh'; find skills -name '*.sh'; })
          exit $fail

      - name: Check Python scripts parse
        run: |
          fail=0
          while IFS= read -r f; do
            python3 -c "import ast,sys; ast.parse(open(sys.argv[1]).read())" "$f" \
              || { echo "Syntax error: $f"; fail=1; }
          done < <(find skills -name '*.py')
          exit $fail

      # md_to_html shells out to pandoc, and the suite SKIPS its tests when pandoc
      # is absent. The runner has no pandoc, so without this those assertions would
      # quietly not run - and md_to_html builds the HTML body of every email the
      # skill sends. A skipped test in a green build is the bug we are fixing here.
      - name: Install pandoc (required by the md_to_html tests)
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends pandoc

      # The suites are offline: they extract the real functions from the scripts
      # and exercise them against a mocked api_call, so no account or network is
      # needed. Discovered rather than listed, so a new *_test.sh is picked up.
      - name: Run unit tests
        run: |
          fail=0
          found=0
          skipped=0
          while IFS= read -r t; do
            found=1
            echo "::group::$t"
            out=$(bash "$t" 2>&1) || fail=1
            printf '%s\n' "$out"
            if printf '%s\n' "$out" | grep -q '^skip - '; then skipped=1; fi
            echo "::endgroup::"
          done < <(find skills -name '*_test.sh' | sort)
          if [ "$found" -eq 0 ]; then
            echo "::error::No test suites found - the runner is not testing anything."
            exit 1
          fi
          if [ "$skipped" -ne 0 ]; then
            echo "::error::A suite skipped tests (missing dependency). CI must install it and run them."
            fail=1
          fi
          exit $fail

      - name: Check SKILL.md frontmatter
        run: |
          python3 - <<'PY'
          import sys, pathlib, re
          ok = True
          for skill in sorted(pathlib.Path("skills").glob("*/SKILL.md")):
              text = skill.read_text(encoding="utf-8")
              m = re.match(r"^---\n(.*?)\n---", text, re.S)
              if not m:
                  print(f"{skill}: missing YAML frontmatter"); ok = False; continue
              fm = m.group(1)
              name = re.search(r"^name:\s*(.+)$", fm, re.M)
              desc = re.search(r"^description:\s*(.+)$", fm, re.M)
              if not name:
                  print(f"{skill}: missing 'name'"); ok = False
              else:
                  name = name.group(1).strip()
                  if name != skill.parent.name:
                      print(f"{skill}: name '{name}' != directory '{skill.parent.name}'"); ok = False
                  if not re.fullmatch(r"[a-z0-9-]{1,64}", name):
                      print(f"{skill}: name must be lowercase alphanumeric/hyphen, <=64 chars"); ok = False
              if not desc:
                  print(f"{skill}: missing 'description'"); ok = False
              elif len(desc.group(1).strip()) > 1024:
                  print(f"{skill}: description exceeds 1024 chars"); ok = False
          sys.exit(0 if ok else 1)
          PY

  pst-to-markdown:
    name: pst-to-markdown (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Hard 3.9 floor: parse_email_address annotates `tuple[str, str]` at
        # runtime with no `from __future__ import annotations`, so PEP 585
        # builtin generics must exist for the module to import at all.
        python-version: ['3.9', '3.11', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies (requirements.txt minus libratom)
        working-directory: skills/pst-to-markdown
        # Deliberately NOT the full requirements.txt. libratom pins
        # numpy==1.23.5, which has no wheel above cp311 and cannot build on
        # 3.12+ - installing it here would make this job unrunnable on current
        # Python. libratom is an optional guarded import and the extraction
        # driver that uses it needs a real PST fixture, so the suite runs fine
        # without it. The full-install path is proved by the job below.
        #
        # Filtered from requirements.txt rather than hand-listed, so a new
        # dependency added there is picked up here instead of silently missing.
        run: |
          set -euo pipefail
          grep -v '^libratom' requirements.txt > /tmp/requirements-no-libratom.txt
          echo "installing:"; cat /tmp/requirements-no-libratom.txt
          python -m pip install --upgrade pip pytest
          python -m pip install -r /tmp/requirements-no-libratom.txt

      - name: Run test suite
        working-directory: skills/pst-to-markdown
        run: python -m pytest tests/ -v -p no:cacheprovider

  pst-to-markdown-install:
    name: pst-to-markdown (full requirements, py3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.11 is the real ceiling for the documented install, not a preference:
          # libratom pins numpy==1.23.5, whose newest wheel is cp311. This job
          # exists so that ceiling is asserted rather than discovered by a user.
          # If it ever starts failing, libratom has moved and setup.sh's
          # interpreter-selection cap needs revisiting.
          python-version: '3.11'

      - name: Install the full documented requirements
        working-directory: skills/pst-to-markdown
        # setuptools and wheel go in first: libratom's transitive numpy==1.23.5
        # is an sdist here and needs a build backend present to configure.
        run: |
          python -m pip install --upgrade pip setuptools wheel pytest
          python -m pip install -r requirements.txt

      - name: libratom is importable, so the extraction path is real
        working-directory: skills/pst-to-markdown
        run: |
          python -c "from libratom.lib.pff import PffArchive; print('libratom import OK')"
          python -c "
          import sys; sys.path.insert(0, 'scripts')
          import extract_pst
          assert extract_pst.USE_LIBRATOM, 'libratom installed but not detected'
          print('extract_pst detects libratom')
          "

      - name: Run the suite against the full dependency set
        working-directory: skills/pst-to-markdown
        run: python -m pytest tests/ -v -p no:cacheprovider
